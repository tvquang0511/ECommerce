# Compose overlay for running user-service + mail-worker in containers.
# Usage:
#   docker compose -f infra/docker/docker-compose.dev.yml -f infra/docker/docker-compose.user-service.dev.yml up -d --build

services:
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    env_file:
      - ../../services/user-service/.env
    environment:
      # Container networking: talk to other compose services by name
      DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/user?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4001
      NODE_ENV: development
    ports:
      - "4001:4001"
    depends_on:
      - postgres
      - redis

  mail-worker:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    command: ["pnpm", "--filter", "user-service", "worker:mail"]
    env_file:
      - ../../services/user-service/.env
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/user?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      - redis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ecommerce_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ecommerce_redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ecommerce_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ecommerce_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 1;
      done;

      mc mb -p local/user-public || true;
      mc anonymous set download local/user-public || true;
      mc mb -p local/product-private || true;

      echo 'minio init done';
      "

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    env_file:
      - ../../services/user-service/.env
    environment:
      PORT: "4001"
      NODE_ENV: development
      DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/user?schema=public
      REDIS_URL: redis://redis:6379
      APP_WEB_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      - postgres
      - redis
      - minio

  product-subgraph:
    build:
      context: ../..
      dockerfile: services/product-subgraph/Dockerfile
    env_file:
      - ../../services/product-subgraph/.env
    environment:
      PORT: "4002"
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/product-subgraph
      USER_SERVICE_BASE_URL: http://user-service:4001
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
    depends_on:
      - mongo
      - redis
      - minio
      - user-service

  cart-subgraph:
    build:
      context: ../..
      dockerfile: services/cart-subgraph/Dockerfile
    env_file:
      - ../../services/cart-subgraph/.env
    environment:
      PORT: "4003"
      NODE_ENV: development
      PRODUCT_SUBGRAPH_URL: http://product-subgraph:4002/graphql
      REDIS_URL: redis://redis:6379
      USER_SERVICE_BASE_URL: http://user-service:4001
    depends_on:
      - redis
      - product-subgraph
      - user-service

  order-subgraph:
    build:
      context: ../..
      dockerfile: services/order-subgraph/Dockerfile
    env_file:
      - ../../services/order-subgraph/.env
    environment:
      PORT: "4004"
      NODE_ENV: development
      USER_SERVICE_BASE_URL: http://user-service:4001
      PRODUCT_SUBGRAPH_BASE_URL: http://product-subgraph:4002
      ORDER_DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/order
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672
      RABBITMQ_EXCHANGE: order.integration
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      product-subgraph:
        condition: service_started
      user-service:
        condition: service_started

  graphql-gateway:
    build:
      context: ../..
      dockerfile: services/graphql-gateway/Dockerfile
    environment:
      PORT: "4000"
      NODE_ENV: development
      PRODUCT_SUBGRAPH_URL: http://product-subgraph:4002/graphql
      CART_SUBGRAPH_URL: http://cart-subgraph:4003/graphql
      ORDER_SUBGRAPH_URL: http://order-subgraph:4004/graphql
    restart: unless-stopped
    depends_on:
      - product-subgraph
      - cart-subgraph
      - order-subgraph

  inventory-service:
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    env_file:
      - ../../services/inventory-service/.env
    environment:
      PORT: "4010"
      NODE_ENV: development
      ORDER_SUBGRAPH_BASE_URL: http://order-subgraph:4004
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672
      RABBITMQ_EXCHANGE: order.integration
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      order-subgraph:
        condition: service_started

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    env_file:
      - ../../services/payment-service/.env
    environment:
      PORT: "4020"
      NODE_ENV: development
      ORDER_SUBGRAPH_BASE_URL: http://order-subgraph:4004
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672
      RABBITMQ_EXCHANGE: order.integration
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      order-subgraph:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - user-service
      - product-subgraph
      - cart-subgraph
      - graphql-gateway
      - order-subgraph
      - inventory-service
      - payment-service
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ecommerce_postgres_data:
    name: ecommerce_postgres_data
  ecommerce_mongo_data:
    name: ecommerce_mongo_data
  ecommerce_redis_data:
    name: ecommerce_redis_data
  ecommerce_rabbitmq_data:
    name: ecommerce_rabbitmq_data
  ecommerce_minio_data:
    name: ecommerce_minio_data

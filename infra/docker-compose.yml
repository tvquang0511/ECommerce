# Full stack (later): infra + app containers.
# For day-1 dev, prefer infra-only: docker compose -f infra/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  product-subgraph:
    build:
      context: ..
      dockerfile: services/product-subgraph/Dockerfile
    environment:
      PORT: "4002"
    ports:
      - "4002:4002"
    depends_on:
      - mongo
      - redis
      - minio

  graphql-gateway:
    build:
      context: ..
      dockerfile: services/graphql-gateway/Dockerfile
    environment:
      PORT: "4000"
      PRODUCT_SUBGRAPH_URL: "http://product-subgraph:4002/graphql"
    ports:
      - "4000:4000"
    depends_on:
      - product-subgraph

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:

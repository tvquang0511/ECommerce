# Demo reverse proxy for the Coursera/Packt advanced microservices report.
# All application services run inside Docker Compose and are exposed via one Nginx entrypoint.

server {
  listen 80;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header x-request-id $request_id;

  location = / {
    default_type text/plain;
    return 200 "ECommerce demo reverse proxy is running.\n";
  }

  # user-service REST
  location /api/users/ {
    proxy_pass http://user-service:4001;
  }

  # Apollo federation gateway
  location /graphql {
    proxy_pass http://graphql-gateway:4000/graphql;
    proxy_set_header Authorization $http_authorization;
  }

  # inventory-service REST
  location /api/inventory/ {
    proxy_pass http://inventory-service:4010;
  }

  # payment-service REST
  location /api/payments/ {
    proxy_pass http://payment-service:4020;
  }

  # RabbitMQ management UI
  location /rabbitmq/ {
    proxy_pass http://rabbitmq:15672/;
  }

  # MinIO console for demo
  location /minio/ {
    proxy_pass http://minio:9001/;
  }
}

# Dev-only Nginx reverse proxy.
# This assumes your app services run on the HOST (pnpm dev), and Nginx runs in Docker.
# Later (when you dockerize services), replace host.docker.internal with Docker service names.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;

  # Next.js dev server (HMR / websocket)
  location / {
    proxy_pass http://host.docker.internal:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Apollo Gateway
  location /graphql {
    proxy_pass http://host.docker.internal:4000/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Forward auth header to gateway
    proxy_set_header Authorization $http_authorization;
    proxy_set_header x-request-id $request_id;
  }

  # Auth/users REST
  location /api/users/ {
    proxy_pass http://host.docker.internal:4001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header x-request-id $request_id;
  }
}
